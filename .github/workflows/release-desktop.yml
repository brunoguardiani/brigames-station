name: Release desktop applications

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  version:
    name: Read release version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      value: ${{ steps.version.outputs.value }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - id: version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")

          case "$version" in
            [0-9]*.[0-9]*.[0-9]* | [0-9]*.[0-9]*.[0-9]*-*) ;;
            *)
              echo "Invalid desktop version: $version" >&2
              exit 1
              ;;
          esac

          echo "value=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64 installer
    needs: version
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @brigames-station/desktop run test:updater

      - run: pnpm --filter @brigames-station/desktop run dist:win

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-Item "apps/desktop/release/brigames-station-Setup-${{ needs.version.outputs.value }}.exe"
          $checksum = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $($installer.Name)" | Set-Content -LiteralPath "$($installer.FullName).sha256" -NoNewline

      - uses: actions/upload-artifact@v4
        with:
          name: brigames-station-windows-${{ needs.version.outputs.value }}
          path: |
            apps/desktop/release/brigames-station-Setup-${{ needs.version.outputs.value }}.exe
            apps/desktop/release/brigames-station-Setup-${{ needs.version.outputs.value }}.exe.sha256
            apps/desktop/release/brigames-station-Setup-${{ needs.version.outputs.value }}.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 90

  macos:
    name: macOS Apple Silicon and Intel installers
    needs: version
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @brigames-station/desktop run test:updater

      - name: Rebuild Sparkle bridge for Electron
        run: >-
          pnpm --filter @brigames-station/desktop exec electron-sparkle-updater rebuild
          --electron-version 43.4.0
          --arch universal

      - run: pnpm --filter @brigames-station/desktop run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Validate packaged macOS applications
        shell: bash
        run: |
          set -euo pipefail
          expected_feed='https://github.com/brunoguardiani/brigames-station/releases/latest/download/appcast.xml'
          expected_key='1/K7+eGRHMy6hPZCqQcyVcgidr9F1LGrQbFCIE4c5Vo='

          test "$(find apps/desktop/release -maxdepth 2 -type d -name 'brigames-station.app' | wc -l | tr -d ' ')" -eq 3
          while IFS= read -r application; do
            codesign --verify --deep --strict --verbose=2 "$application"
            codesign -dv --verbose=4 "$application"
            plist="$application/Contents/Info.plist"
            test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$plist")" = "$expected_feed"
            test "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$plist")" = "$expected_key"
            test -d "$application/Contents/Frameworks/Sparkle.framework"
            find "$application/Contents/Resources/app.asar.unpacked" -name 'sparkle_bridge.node' -type f | grep -q .
            ! grep -R -F -q 'SPARKLE_ED_PUBLIC_KEY_PLACEHOLDER' "$application"
          done < <(find apps/desktop/release -maxdepth 2 -type d -name 'brigames-station.app' | sort)

          test "$(find apps/desktop/release -maxdepth 1 -name '*.zip' | wc -l | tr -d ' ')" -eq 1
          for archive in apps/desktop/release/*-universal-mac.zip; do
            extract_dir="${RUNNER_TEMP}/$(basename "$archive" .zip)"
            ditto -x -k "$archive" "$extract_dir"
            test "$(find "$extract_dir" -maxdepth 1 -type d -name 'brigames-station.app' | wc -l | tr -d ' ')" -eq 1
            archived_app=$(find "$extract_dir" -maxdepth 1 -type d -name 'brigames-station.app')
            codesign --verify --deep --strict "$archived_app"
            architectures=$(lipo -archs "$archived_app/Contents/MacOS/brigames-station")
            test "$architectures" = 'x86_64 arm64' || test "$architectures" = 'arm64 x86_64'
          done
          test ! -e apps/desktop/release/latest-mac.yml
          ! find apps/desktop/release -maxdepth 1 -name '*-mac.zip.blockmap' -print | grep -q .

      - name: Create SHA-256 checksums
        shell: bash
        run: |
          for installer in apps/desktop/release/*.dmg apps/desktop/release/*.zip; do
            checksum=$(shasum -a 256 "$installer" | awk '{print $1}')
            printf '%s  %s\n' "$checksum" "$(basename "$installer")" > "$installer.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: brigames-station-macos-${{ needs.version.outputs.value }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.dmg.sha256
            apps/desktop/release/*.zip
            apps/desktop/release/*.zip.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Prepare isolated Sparkle archive directory
        shell: bash
        run: |
          mkdir -p apps/desktop/sparkle-release
          cp apps/desktop/release/*.zip apps/desktop/sparkle-release/

      - name: Verify Sparkle signing secret is configured
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        shell: bash
        run: test -n "$SPARKLE_ED_PRIVATE_KEY"

      - name: Expose the workspace Sparkle CLI to the composite action
        shell: bash
        run: |
          mkdir -p node_modules/.bin
          ln -sf "$GITHUB_WORKSPACE/apps/desktop/node_modules/.bin/electron-sparkle-updater" \
            node_modules/.bin/electron-sparkle-updater

      - name: Generate signed Sparkle appcast
        uses: Innei/electron-sparkle-updater/action@5b71644e65427843f67b185460cd7d02b2787857
        with:
          tag: v${{ needs.version.outputs.value }}
          archive-dir: apps/desktop/sparkle-release
          ed-private-key: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          repo: brunoguardiani/brigames-station
          tag-prefix: v
          fetch-delta-bases: 'true'
          publish: 'false'

      - name: Ensure the private key is absent from artifacts
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const secret = Buffer.from(process.env.SPARKLE_ED_PRIVATE_KEY || '');
          if (secret.length === 0) throw new Error('Sparkle signing secret is missing.');
          const roots = ['apps/desktop/release', 'apps/desktop/sparkle-release'];
          const visit = (entry) => {
            const stat = fs.statSync(entry);
            if (stat.isDirectory()) {
              for (const child of fs.readdirSync(entry)) visit(path.join(entry, child));
            } else if (fs.readFileSync(entry).includes(secret)) {
              throw new Error('Sparkle signing secret was found in a release artifact.');
            }
          };
          for (const root of roots) visit(root);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: brigames-station-appcast-${{ needs.version.outputs.value }}
          path: |
            apps/desktop/sparkle-release/appcast.xml
            apps/desktop/sparkle-release/*.delta
          if-no-files-found: error
          retention-days: 90

  linux:
    name: Linux x64 packages
    needs: version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @brigames-station/desktop run dist:linux

      - name: Create SHA-256 checksums
        shell: bash
        run: |
          shopt -s nullglob

          installers=(
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          )

          test "${#installers[@]}" -gt 0

          for installer in "${installers[@]}"; do
            checksum=$(sha256sum "$installer" | awk '{print $1}')
            printf '%s  %s\n' "$checksum" "$(basename "$installer")" > "$installer.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: brigames-station-linux-${{ needs.version.outputs.value }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.AppImage.sha256
            apps/desktop/release/*.deb
            apps/desktop/release/*.deb.sha256
            apps/desktop/release/latest-linux.yml
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish GitHub Release
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Validate auto-update metadata
        shell: bash
        run: |
          set -euo pipefail

          test -f release-artifacts/latest.yml
          test -f release-artifacts/latest-linux.yml
          test -s release-artifacts/appcast.xml

          windows_path=$(sed -n 's/^path: //p' release-artifacts/latest.yml | head -n 1)
          linux_path=$(sed -n 's/^path: //p' release-artifacts/latest-linux.yml | head -n 1)

          test -n "$windows_path" && test -f "release-artifacts/$windows_path"
          test -n "$linux_path" && test -f "release-artifacts/$linux_path"
          test -f "release-artifacts/$windows_path.blockmap"

          expected_prefix="https://github.com/brunoguardiani/brigames-station/releases/download/v${{ needs.version.outputs.value }}/"
          mac_archives=("brigames-station-${{ needs.version.outputs.value }}-universal-mac.zip")
          for archive in "${mac_archives[@]}"; do
            test -f "release-artifacts/$archive"
            grep -F -q "url=\"${expected_prefix}${archive}\"" release-artifacts/appcast.xml
          done
          test "$(grep -o 'sparkle:edSignature=' release-artifacts/appcast.xml | wc -l | tr -d ' ')" -eq 1
          ! grep -R -F -q 'SPARKLE_ED_PUBLIC_KEY_PLACEHOLDER' release-artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.value }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          find release-artifacts -type f -print

          gh release create "v$RELEASE_VERSION" release-artifacts/* \
            --target "$RELEASE_SHA" \
            --title "brigames-station v$RELEASE_VERSION" \
            --generate-notes

      - name: Get release information
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.value }}
        run: |
          release_url=$(gh release view "v$RELEASE_VERSION" --json url --jq '.url')
          release_body=$(gh release view "v$RELEASE_VERSION" --json body --jq '.body')

          {
            echo "url=$release_url"
            echo "body<<EOF"
            echo "$release_body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke test anonymous Sparkle feed
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/brunoguardiani/brigames-station/releases/latest/download/appcast.xml \
            >/dev/null

      - name: Send release notification to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_VERSION: ${{ needs.version.outputs.value }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          RELEASE_BODY: ${{ steps.release.outputs.body }}
          RELEASE_AUTHOR: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$DISCORD_WEBHOOK_URL"

          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg author "$RELEASE_AUTHOR" \
            --arg body "$RELEASE_BODY" \
            --arg url "$RELEASE_URL" \
            '{
              embeds: [
                {
                  title: ("🚀 Nova release: v" + $version),
                  url: $url,
                  description: (
                    "**Versão:** `" + $version + "`\n" +
                    "**Autor:** " + $author + "\n\n" +
                    (
                      if $body == "" or $body == "null"
                      then "Sem notas de versão."
                      else $body
                      end
                    )
                  )[0:4096],
                  color: 5814783
                }
              ]
            }' > discord-payload.json

          echo "Sending release notification to Discord..."

          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --retry-all-errors \
            --header 'Content-Type: application/json' \
            --data-binary @discord-payload.json \
            "$DISCORD_WEBHOOK_URL"

          echo "Discord notification sent successfully."
