openapi: 3.1.0
info:
  title: brigames-station API
  version: 0.0.0
  description: HTTP contract for the brigames-station control plane.
servers:
  - url: /
    description: API base path
paths:
  /health:
    get:
      summary: Check backend liveness
      description: Confirms that the HTTP backend process is alive. This endpoint does not depend on PostgreSQL.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Backend process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessStatus'
        '500':
          description: Unexpected backend failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorStatus'
  /ready:
    get:
      summary: Check backend readiness
      description: Confirms that the backend can reach PostgreSQL and is ready to serve requests.
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Backend is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: Backend is not ready because PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
  /auth/register:
    post:
      summary: Register a member account
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/RegistrationDisabled'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/login:
    post:
      summary: Authenticate with username or email
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      summary: Rotate a refresh token
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      summary: Revoke a refresh token
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Refresh token revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    get:
      summary: Get the authenticated user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorStatus'
    RegistrationDisabled:
      description: Registration is disabled.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorStatus'
    Conflict:
      description: Username or email already exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorStatus'
    Unauthorized:
      description: Credentials or token are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorStatus'
  schemas:
    LivenessStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: alive
          example: alive
    ReadinessStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
          example: ready
    ErrorStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: error
          example: error
    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 12
    LoginRequest:
      type: object
      required: [identity, password]
      properties:
        identity:
          type: string
          description: Username or email.
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          const: 900
    User:
      type: object
      required: [id, username, email, role]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, member]
