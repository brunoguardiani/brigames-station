services:
  api:
    build:
      context: ./apps/server
    image: brigames-station-api:${APP_VERSION:-local}
    env_file: ${ENV_FILE:-.env.production}
    restart: unless-stopped
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/api.http.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-webroot:/var/www/certbot:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v5.7.0
    profiles: ["tools"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot

  migrate:
    image: brigames-station-api:${APP_VERSION:-local}
    build:
      context: ./apps/server
    env_file: ${ENV_FILE:-.env.production}
    command: ["./migrate"]
    profiles: ["tools"]

  seed-owner:
    image: brigames-station-api:${APP_VERSION:-local}
    build:
      context: ./apps/server
    env_file: ${ENV_FILE:-.env.production}
    command: ["./seed-owner"]
    profiles: ["tools"]

volumes:
  letsencrypt:
  certbot-webroot:
